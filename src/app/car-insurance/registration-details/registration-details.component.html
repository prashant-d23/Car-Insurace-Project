<div class="container w-75 mt-1">
  <div class="row">
    <div class="col-md-6 border rounded-start">
       <label for="id1" class="form-label labelClass ms-1 fs-5 fw-bold mt-3">When did you register your car?</label>
     <!-- <input type="text" class="form-control modal-input ms-1" id="id1" placeholder="Search Make"
        [(ngModel)]="insuranceData.modelName"> -->



<form [formGroup]="regForm">
  <div class="row">
    <div class="col-md-4">
      <select formControlName="year" class="form-select">
        <option value="">Selecte Year</option>
        <option *ngFor="let year of years" [value]="year">{{year}}</option>
      </select>
    </div>
    <div class="col-md-4">
      <select formControlName="month" class="form-select">
        <option value="">Month</option>
        <option *ngFor="let month of months" [value]="month">{{month}}</option>
      </select>
    </div>
    <div class="mt-3">
      <mat-slide-toggle></mat-slide-toggle><span class="mx-4 fs-6 fw-semibold">It's a brand new Car</span>
    </div>
    <div class="row mt-3">
      <button type="button" class="btn btn-primary w-50" (click)="toggleform()">Continue</button>
    </div>
    <div *ngIf="isVisible == true">
      <input type="search" name="search" id="" class="form-control search" placeholder="search">
      <h4 class="heading"> Popular Locations </h4>
      <div class="row">
        <div class="col-md-5" >
          <ul class="custom-list">
            <li *ngFor="let city of popularCities.slice(0, 5)" class="border m-3 cursor-pointer">{{ city }} <span class="arrow"><i class="bi bi-chevron-right"></i></span></li>
          </ul>
        </div>
        <div class="col-md-5">
          <ul>
            <li *ngFor="let city of popularCities.slice(5)" class="border m-3 cursor-pointer">{{ city }}<span class="arrow2"><i class="bi bi-chevron-right"></i></span>
            </li>
          </ul>
        </div>
      </div>
    </div>

  </div>
</form>




    </div>
    <div class="col-md-6 border rounded-end">
      <app-insurance-details [insuranceData]="insuranceData"></app-insurance-details>
    </div>
  </div>
</div>
