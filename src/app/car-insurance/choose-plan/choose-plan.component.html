
<div class="container">
  <div class="row ms-5 w-100">
    <div class="col-md-3 p-3 border rounded card" *ngFor="let plan of planInfo?.plans" (click)="setPlan(plan.planName)" [ngClass]="plan.planName === selectedPlan ? 'border-warning border-2' : ''">
      <h3 class="fs-6 fw-bold">{{plan.planName}}</h3>
      <p class="fs-6 text-muted">{{plan.planDes}}</p>
      <h4 class="fs-6 fw-semibold mt-2">&#8377;{{plan.netPremium}}</h4>
      <div>
      </div>
    </div>
   <div class="slider border p-3">
    <p class="fs-6 fw-semibold">Insured Value (IDV)</p>
    <label for="customRange2" class="form-label"></label>
    <input type="range" class="form-range" min="50" max="100" id="customRange2">
   </div>
  </div>
  <div class="row w-75 mt-3 d-flex">
    <div class="col-md-6 border scroll">
      <p class="fs-6 my-3 ms-2 text-muted">Add Extra coverage (Valid for 1 year only)</p>
      <div class="form-check mt-4" *ngFor="let coverage of addOnCoverageList[0]?.subCovers">
        <input class="form-check-input checkbox" type="checkbox" value="" id="flexCheckDefault">
        <label class="form-check-label mb-3 fs-6" for="flexCheckDefault">
          {{coverage.name}}
        </label>
        <p><span class="fw-bold fs-6">&#8377;{{coverage.netPremium}}</span></p>
        <hr class="mt-3">
      </div>
    </div>


    <div class="col-md-6">
        <app-insurance-details [insuranceData]="insuranceData"></app-insurance-details>
        <div class="border rounded p-3 w-75 ms-5 mt-3" style="background-color: #ecebeb; height: 308px;">
          <h3 class="fw-bold">Cost Breakup</h3>
          <div class="d-flex">
            <div class=" w-75">Third Party Premium</div>
            <div class=" flex-shrink-1">1000</div>
          </div>
          <hr>
          <div class="d-flex">
            <div class=" w-75">Own Damage Premium</div>
            <div class=" flex-shrink-1">1000</div>
          </div>
          <hr>
          <div class="d-flex">
            <div class=" w-75">Add-Ons Premium</div>
            <div class=" flex-shrink-1">1000</div>
          </div>
          <hr>
          <div class="d-flex">
            <div class=" w-75">Net Premium</div>
            <div class=" flex-shrink-1">1000</div>
          </div>
          <hr>
          <div class="float-end">
           <div>This price is excluding 18% GST</div>
          </div>



        </div>

    </div>


  </div>
</div>
